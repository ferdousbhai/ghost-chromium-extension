<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ghost browser relay</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1c1c1e;
        --muted: #6b6b70;
        --bg: #ffffff;
        --line: #e2e2e6;
        --on: #1a7f37;
        --off: #8b8b8b;
        --warn: #9a6700;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f2f2f4;
          --muted: #a0a0a8;
          --bg: #1b1b1f;
          --line: #34343a;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 10px 0;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--off);
        flex: none;
      }
      .dot.on { background: var(--on); }
      .dot.paused { background: var(--warn); }
      p.note {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 14px 0 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="text"],
      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        margin-bottom: 10px;
      }
      .row > :first-child { flex: 1; }
      .port { width: 82px; flex: none; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        border-color: transparent;
        background: var(--fg);
        color: var(--bg);
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
      }
      .toggle span { font-size: 12px; color: var(--muted); }
      .saved {
        color: var(--on);
        font-size: 12px;
        margin-left: 8px;
      }
      .tab {
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        word-break: break-all;
      }
      .tab strong { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Ghost browser relay</h1>
    <p class="note">Lets a ghost drive one tab of this browser — the one you are already signed into.</p>

    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking…</span></div>
    <p class="note" id="detail"></p>
    <div class="tab" id="tab" hidden></div>

    <hr />

    <div class="row">
      <div>
        <label for="token">Pairing token — <code>ghostd relay-token</code></label>
        <input type="text" id="token" spellcheck="false" autocomplete="off" placeholder="64 hex characters" />
      </div>
    </div>
    <div class="row">
      <div class="port">
        <label for="port">Port</label>
        <input type="number" id="port" min="1" max="65535" />
      </div>
      <button class="primary" id="save" type="button">Save &amp; connect</button>
      <span class="saved" id="saved" hidden>Saved</span>
    </div>

    <div class="toggle">
      <span id="enabledLabel">The ghost may drive this browser</span>
      <button id="toggle" type="button">Pause</button>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
